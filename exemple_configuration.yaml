esphome:
  name: marantz-sr5004

esp32:
  board: esp32dev  # <-- remplace par ta carte ESP32 exacte si différente
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------------------------------------------------------
# Pointe vers ton dossier components/ (celui qui contient marantz_v2007/)
# Adapte le chemin selon où se trouve ce fichier par rapport au dossier.
# ---------------------------------------------------------------
external_components:
  - source:
      type: local
      path: components

# ---------------------------------------------------------------
# UART vers le MAX3232
# Marantz RS232 : 9600 bauds, 8 bits de données, pas de parité,
# 1 bit de stop (8N1) -- c'est la config standard Marantz/Denon.
# Adapte tx_pin / rx_pin à ton câblage réel.
# ---------------------------------------------------------------
uart:
  id: uart_marantz
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

marantz_v2007:
  id: marantz

media_player:
  - platform: marantz_v2007
    name: "Ampli Marantz SR5004"
    marantz_id: marantz

# ---------------------------------------------------------------
# OUTIL DE TEST : permet d'envoyer n'importe quelle commande brute
# à l'ampli directement depuis Home Assistant, sans toucher au code.
# Utile pour découvrir/confirmer les commandes qu'on ne connait pas
# encore avec certitude (ex: le volume exact en absolu).
#
# Utilisation : dans Home Assistant, tape par exemple "@VOL:-30"
# dans le champ texte "Marantz - commande brute", regarde dans les
# logs ESPHome (onglet Logs de l'appareil) ce que l'ampli répond,
# et observe ce qui se passe sur l'ampli physique.
# ---------------------------------------------------------------
text:
  - platform: template
    name: "Marantz - commande brute"
    id: marantz_raw_command
    optimistic: true
    mode: text
    on_value:
      then:
        - uart.write:
            id: uart_marantz
            data: !lambda |-
              std::string cmd = x + "\r";
              return std::vector<uint8_t>(cmd.begin(), cmd.end());

# ---------------------------------------------------------------
# Quelques boutons de test rapides (facultatif, tu peux les
# supprimer une fois que tout fonctionne bien via l'entité
# media_player ci-dessus).
# ---------------------------------------------------------------
button:
  - platform: template
    name: "Marantz - Power ON"
    on_press:
      - lambda: id(marantz).power_on();

  - platform: template
    name: "Marantz - Power OFF"
    on_press:
      - lambda: id(marantz).power_off();

  - platform: template
    name: "Marantz - Volume +"
    on_press:
      - lambda: id(marantz).volume_up();

  - platform: template
    name: "Marantz - Volume -"
    on_press:
      - lambda: id(marantz).volume_down();
